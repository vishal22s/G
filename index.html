<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PDF Page Splitter & Imposer — 16-up with per-mini-page watermark</title>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://unpkg.com/pdfjs-dist@3.4.120/build/pdf.min.js"></script>

<style>
    :root{
        --primary:#007bff; --secondary:#6c757d; --bg:#f8f9fa; --card:#fff;
        --text:#212529; --border:#dee2e6; --success:#28a745;
    }
    body{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background:var(--bg); color:var(--text); margin:0; padding:20px; display:flex; justify-content:center;}
    .container{max-width:900px;width:100%;background:var(--card);padding:28px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.08);}
    h1{color:var(--primary); text-align:center; margin:0 0 8px;}
    p.desc{color:var(--secondary); text-align:center; margin:0 0 20px;}
    .section{margin-bottom:18px;padding:16px;border:1px solid var(--border);border-radius:6px;}
    .upload-area{display:block;text-align:center;border:2px dashed var(--border);padding:36px;border-radius:6px;cursor:pointer;transition:border-color .2s, background .2s;}
    .upload-area:hover, .upload-area.dragover{background:#eef2f6;border-color:var(--primary);}
    #pdf-upload{display:none;}
    #file-name{margin-top:12px;font-weight:600;color:var(--primary);}
    details{border:1px solid var(--border);border-radius:6px;padding:10px;}
    summary{font-weight:700;color:var(--primary);cursor:pointer;}
    .watermark-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px;}
    .control-group{display:flex;flex-direction:column;}
    .control-group label{margin-bottom:6px;font-size:.9rem;color:var(--secondary);}
    input[type="text"], input[type="color"], select{padding:8px;border-radius:6px;border:1px solid var(--border);width:100%;box-sizing:border-box;}
    .btn{display:block;width:100%;padding:12px;font-weight:700;color:#fff;background:var(--primary);border:none;border-radius:6px;cursor:pointer;}
    .btn:disabled{background:var(--secondary);cursor:not-allowed;}
    #progress-container{text-align:center;margin-top:16px;}
    #output-container{display:none;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;}
    @media (max-width: 600px) { #output-container{grid-template-columns:1fr;} }
    .output-box{text-align:center;}
    .output-box canvas{border:1px solid var(--border);max-width:400px;width:100%;height:auto;border-radius:4px;}
    .download-btn{display:inline-block;margin-top:12px;padding:10px 16px;background:var(--success);color:#fff;border-radius:6px;text-decoration:none;font-weight:600;}
    .hidden{display:none !important;}
</style>
</head>
<body>
<div class="container">
    <h1>FINAL YEAR PROJECT</h1>
    <p class="desc">Upload a PDF to create duplex-ready 16-up imposed sheets.</p>

    <div class="section">
        <label class="upload-area" id="drop-zone" for="pdf-upload">
            <div>Click to select PDF or drag & drop here</div>
            <p id="file-name">No file selected</p>
        </label>
        <input id="pdf-upload" type="file" accept="application/pdf">
    </div>

    <div class="section">
        <details>
            <summary>Watermark Options (Optional)</summary>
            <div style="margin-top:12px;display:flex;align-items:center;gap:10px;">
                <input id="watermark-enabled" type="checkbox">
                <label for="watermark-enabled">Enable Watermark</label>
            </div>
            <fieldset id="watermark-options" disabled style="margin-top:12px;border:none;padding:0;">
                <div class="watermark-grid">
                    <div class="control-group">
                        <label for="watermark-text">Prefix Text</label>
                        <input id="watermark-text" type="text" placeholder="e.g. EXAM">
                    </div>
                    <div class="control-group">
                        <label for="watermark-position">Position</label>
                        <select id="watermark-position">
                            <option value="center" selected>Center</option>
                            <option value="top-left">Top-Left</option>
                            <option value="top-right">Top-Right</option>
                            <option value="bottom-left">Bottom-Left</option>
                            <option value="bottom-right">Bottom-Right</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="watermark-opacity">Opacity (<span id="opacity-value">0.4</span>)</label>
                        <input id="watermark-opacity" type="range" min="0" max="1" step="0.05" value="0.4">
                    </div>
                    <div class="control-group">
                        <label for="watermark-size">Font Size (<span id="size-value">22</span>pt)</label>
                        <input id="watermark-size" type="range" min="8" max="72" step="1" value="22">
                    </div>
                    <div class="control-group">
                        <label for="watermark-rotation">Rotation (<span id="rotation-value">45</span>°)</label>
                        <input id="watermark-rotation" type="range" min="-90" max="90" step="5" value="45">
                    </div>
                    <div class="control-group">
                        <label for="watermark-color">Color</label>
                        <input id="watermark-color" type="color" value="#dc3545">
                    </div>
                </div>
            </fieldset>
        </details>
    </div>

    <button id="process-btn" class="btn" disabled>Process PDF</button>

    <div id="progress-container" class="hidden">
        <p id="progress-text">Processing...</p>
    </div>

    <div id="output-container">
        <div class="output-box" id="odd-box">
            <h3>Odd Pages (Front)</h3>
            <canvas id="odd-preview"></canvas>
            <div><a id="download-odd-link" class="download-btn hidden" download>Download Odd PDF</a></div>
        </div>
        <div class="output-box" id="even-box">
            <h3>Even Pages (Back)</h3>
            <canvas id="even-preview"></canvas>
            <div><a id="download-even-link" class="download-btn hidden" download>Download Even PDF</a></div>
        </div>
    </div>
</div>

<script>
/* Setup PDF.js worker */
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.4.120/build/pdf.worker.min.js';

/* DOM refs */
const pdfUpload = document.getElementById('pdf-upload');
const dropZone = document.getElementById('drop-zone');
const fileNameDisplay = document.getElementById('file-name');
const processBtn = document.getElementById('process-btn');
const progressContainer = document.getElementById('progress-container');
const progressText = document.getElementById('progress-text');
const outputContainer = document.getElementById('output-container');

const wmEnabled = document.getElementById('watermark-enabled');
const wmOptions = document.getElementById('watermark-options');
const wmText = document.getElementById('watermark-text');
const wmPosition = document.getElementById('watermark-position');
const wmOpacity = document.getElementById('watermark-opacity');
const wmSize = document.getElementById('watermark-size');
const wmRotation = document.getElementById('watermark-rotation');
const wmColor = document.getElementById('watermark-color');
const opacityValue = document.getElementById('opacity-value');
const sizeValue = document.getElementById('size-value');
const rotationValue = document.getElementById('rotation-value');

const oddBox = document.getElementById('odd-box');
const evenBox = document.getElementById('even-box');
const oddCanvas = document.getElementById('odd-preview');
const evenCanvas = document.getElementById('even-preview');
const downloadOddLink = document.getElementById('download-odd-link');
const downloadEvenLink = document.getElementById('download-even-link');

let selectedFile = null;
let currentOddBlobUrl = null;
let currentEvenBlobUrl = null;

/* Drag and Drop */
['dragenter', 'dragover'].forEach(eventName => {
    dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });
});

['dragleave', 'drop'].forEach(eventName => {
    dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
    });
});

dropZone.addEventListener('drop', (e) => {
    const files = e.dataTransfer.files;
    if (files && files.length > 0 && files[0].type === 'application/pdf') {
        handleFileSelection(files[0]);
    } else {
        alert('Please drop a valid PDF file.');
    }
});

pdfUpload.addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) {
        handleFileSelection(e.target.files[0]);
    }
});

function handleFileSelection(file) {
    selectedFile = file;
    fileNameDisplay.textContent = file.name;
    processBtn.disabled = false;
}

wmEnabled.addEventListener('change', () => {
    wmOptions.disabled = !wmEnabled.checked;
});

wmOpacity.addEventListener('input', () => opacityValue.textContent = wmOpacity.value);
wmSize.addEventListener('input', () => sizeValue.textContent = wmSize.value);
wmRotation.addEventListener('input', () => rotationValue.textContent = wmRotation.value);

processBtn.addEventListener('click', processPDF);

/* Main processing */
async function processPDF() {
    if (!selectedFile) { alert('Please select a PDF file first.'); return; }

    processBtn.disabled = true;
    progressContainer.classList.remove('hidden');
    outputContainer.style.display = 'none';
    downloadOddLink.classList.add('hidden');
    downloadEvenLink.classList.add('hidden');
    progressText.textContent = 'Reading source PDF...';

    // Free previously allocated object URLs
    if (currentOddBlobUrl) URL.revokeObjectURL(currentOddBlobUrl);
    if (currentEvenBlobUrl) URL.revokeObjectURL(currentEvenBlobUrl);

    try {
        const fileBuffer = await selectedFile.arrayBuffer();
        const originalBytes = new Uint8Array(fileBuffer);

        const { PDFDocument } = PDFLib;
        const originalPdf = await PDFDocument.load(originalBytes);
        const pageCount = originalPdf.getPageCount();

        if (pageCount === 0) {
            throw new Error('The selected PDF contains no pages.');
        }

        // 0-based page index lists
        const oddPageIndices = [];
        const evenPageIndices = [];
        for (let i = 0; i < pageCount; i++) {
            if ((i + 1) % 2 !== 0) oddPageIndices.push(i);
            else evenPageIndices.push(i);
        }

        // Configure watermark options
        let watermarkOptions = null;
        if (wmEnabled.checked) {
            const hex = wmColor.value;
            watermarkOptions = {
                text: (wmText.value || '').trim(),
                position: wmPosition.value || 'center',
                opacity: parseFloat(wmOpacity.value),
                size: parseInt(wmSize.value, 10),
                rotation: parseInt(wmRotation.value, 10),
                color: {
                    r: parseInt(hex.slice(1, 3), 16) / 255,
                    g: parseInt(hex.slice(3, 5), 16) / 255,
                    b: parseInt(hex.slice(5, 7), 16) / 255
                }
            };
        }

        // Generate Odd PDF
        progressText.textContent = 'Imposing odd pages...';
        const oddOutputPdf = await createImposedPdf(originalBytes, oddPageIndices, 'odd', (t) => progressText.textContent = t, watermarkOptions);
        const oddPdfBytes = await oddOutputPdf.save();
        currentOddBlobUrl = setupDownload(downloadOddLink, oddPdfBytes, `${selectedFile.name.replace(/\.pdf$/i, '')}_odd_16up.pdf`);
        await renderPreview(oddPdfBytes, oddCanvas);

        // Generate Even PDF if pages exist
        if (evenPageIndices.length > 0) {
            evenBox.style.display = 'block';
            progressText.textContent = 'Imposing even pages...';
            const evenOutputPdf = await createImposedPdf(originalBytes, evenPageIndices, 'even', (t) => progressText.textContent = t, watermarkOptions);
            const evenPdfBytes = await evenOutputPdf.save();
            currentEvenBlobUrl = setupDownload(downloadEvenLink, evenPdfBytes, `${selectedFile.name.replace(/\.pdf$/i, '')}_even_16up.pdf`);
            await renderPreview(evenPdfBytes, evenCanvas);
        } else {
            evenBox.style.display = 'none';
        }

        outputContainer.style.display = 'grid';
        progressText.textContent = 'Processing complete!';
    } catch (err) {
        console.error('Processing error:', err);
        progressText.textContent = `Error: ${err.message || err}`;
        alert(`An error occurred: ${err.message || err}`);
    } finally {
        processBtn.disabled = false;
    }
}

/**
 * Creates a new imposed PDF containing 16 mini-pages per A4 sheet (4x4).
 */
async function createImposedPdf(originalBytes, pageIndices, type, updateProgress, watermarkOptions) {
    const { PDFDocument } = PDFLib;
    const outputPdf = await PDFDocument.create();

    if (!pageIndices || pageIndices.length === 0) return outputPdf;

    const A4_WIDTH = 595.28;  // A4 standard points (approx 595 x 842)
    const A4_HEIGHT = 841.89;
    const cellCols = 4;
    const cellRows = 4;
    const cellWidth = A4_WIDTH / cellCols;
    const cellHeight = A4_HEIGHT / cellRows;

    let embeddedFont = null;
    if (watermarkOptions) {
        embeddedFont = await outputPdf.embedFont(PDFLib.StandardFonts.HelveticaBold);
    }

    // Embed all specified source pages in one pass
    updateProgress(`Embedding ${type} pages...`);
    const embeddedPages = await outputPdf.embedPdf(originalBytes, pageIndices);

    const totalPages = embeddedPages.length;
    const numSheets = Math.ceil(totalPages / 16);

    for (let s = 0; s < numSheets; s++) {
        updateProgress(`Building ${type} sheet (${s + 1}/${numSheets})...`);
        const targetPage = outputPdf.addPage([A4_WIDTH, A4_HEIGHT]);

        const startIdx = s * 16;
        const endIdx = Math.min(startIdx + 16, totalPages);

        for (let idx = startIdx; idx < endIdx; idx++) {
            const i = idx - startIdx;
            const embeddedPage = embeddedPages[idx];
            const originalPageNumber = pageIndices[idx] + 1;

            // Grid placement:
            // Odd pages: Left-to-right (0 -> 3)
            // Even pages: Right-to-left (3 -> 0) for backing alignment on duplex printing
            const row = Math.floor(i / cellCols);
            const col = (type === 'odd') ? (i % cellCols) : (cellCols - 1 - (i % cellCols));

            const cellX = col * cellWidth;
            const cellY = A4_HEIGHT - (row + 1) * cellHeight;

            // Scale preserving aspect ratio inside the cell with a small 2pt margin
            const eW = embeddedPage.width;
            const eH = embeddedPage.height;
            const scale = Math.min((cellWidth - 4) / eW, (cellHeight - 4) / eH);
            const drawW = eW * scale;
            const drawH = eH * scale;

            const drawX = cellX + (cellWidth - drawW) / 2;
            const drawY = cellY + (cellHeight - drawH) / 2;

            targetPage.drawPage(embeddedPage, {
                x: drawX,
                y: drawY,
                width: drawW,
                height: drawH
            });

            // Per-mini-page watermark
            if (watermarkOptions && embeddedFont) {
                const prefix = watermarkOptions.text ? `${watermarkOptions.text} ` : '';
                // Sanitize text to standard ASCII to avoid Helvetica encoding exceptions
                const miniText = `${prefix}${originalPageNumber}`.replace(/[^\x20-\x7E]/g, '');

                if (miniText.length > 0) {
                    let fontSize = watermarkOptions.size || 22;

                    // Bound font size dynamically to avoid overflowing the cell
                    const maxAllowedWidth = drawW * 0.85;
                    let textWidth = embeddedFont.widthOfTextAtSize(miniText, fontSize);
                    if (textWidth > maxAllowedWidth) {
                        fontSize = Math.max(6, Math.floor(fontSize * (maxAllowedWidth / textWidth)));
                        textWidth = embeddedFont.widthOfTextAtSize(miniText, fontSize);
                    }

                    const rad = (watermarkOptions.rotation * Math.PI) / 180;
                    const cos = Math.cos(rad);
                    const sin = Math.sin(rad);

                    // Offsets from baseline origin to text geometric center
                    const cxOffset = textWidth / 2;
                    const cyOffset = fontSize * 0.35;

                    let targetCenterX, targetCenterY;
                    switch (watermarkOptions.position) {
                        case 'top-left':
                            targetCenterX = drawX + textWidth / 2 + 4;
                            targetCenterY = drawY + drawH - fontSize / 2 - 4;
                            break;
                        case 'top-right':
                            targetCenterX = drawX + drawW - textWidth / 2 - 4;
                            targetCenterY = drawY + drawH - fontSize / 2 - 4;
                            break;
                        case 'bottom-left':
                            targetCenterX = drawX + textWidth / 2 + 4;
                            targetCenterY = drawY + fontSize / 2 + 4;
                            break;
                        case 'bottom-right':
                            targetCenterX = drawX + drawW - textWidth / 2 - 4;
                            targetCenterY = drawY + fontSize / 2 + 4;
                            break;
                        case 'center':
                        default:
                            targetCenterX = drawX + drawW / 2;
                            targetCenterY = drawY + drawH / 2;
                            break;
                    }

                    // Calculate baseline position such that rotated text centers exactly on target coordinates
                    const wx = targetCenterX - (cxOffset * cos - cyOffset * sin);
                    const wy = targetCenterY - (cxOffset * sin + cyOffset * cos);

                    targetPage.drawText(miniText, {
                        x: wx,
                        y: wy,
                        size: fontSize,
                        font: embeddedFont,
                        color: PDFLib.rgb(watermarkOptions.color.r, watermarkOptions.color.g, watermarkOptions.color.b),
                        opacity: watermarkOptions.opacity,
                        rotate: PDFLib.degrees(watermarkOptions.rotation)
                    });
                }
            }
        }
    }

    return outputPdf;
}

/* Helpers */
function setupDownload(linkElement, bytes, filename) {
    const blob = new Blob([bytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    linkElement.href = url;
    linkElement.download = filename;
    linkElement.classList.remove('hidden');
    return url;
}

async function renderPreview(pdfBytes, canvasElement) {
    // Cancel active render task on this canvas if currently in-flight
    if (canvasElement._currentRenderTask) {
        try {
            canvasElement._currentRenderTask.cancel();
        } catch (e) {}
    }

    const loadingTask = pdfjsLib.getDocument({ data: pdfBytes });
    const pdf = await loadingTask.promise;
    if (pdf.numPages === 0) return;

    const page = await pdf.getPage(1);
    const viewport = page.getViewport({ scale: 0.8 });
    canvasElement.height = viewport.height;
    canvasElement.width = viewport.width;

    const ctx = canvasElement.getContext('2d');
    ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);

    const renderTask = page.render({ canvasContext: ctx, viewport });
    canvasElement._currentRenderTask = renderTask;

    try {
        await renderTask.promise;
    } catch (err) {
        if (err && err.name !== 'RenderingCancelledException') {
            console.error('Preview render error:', err);
        }
    }
}
</script>
</body>
</html>
